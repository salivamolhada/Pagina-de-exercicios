<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hulk Exercises - GitHub</title>
    <style>
        :root {
            --gamma-green: #2ecc71;
            --hulk-purple: #8e44ad;
            --deep-dark: #0a0a0a;
            --comic-border: #000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            /* Imagem do Hulk de fundo combinada com textura de quadrinhos */
            background: 
                linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
                url('huckimagem.jpg'),
                url('https://www.transparenttextures.com');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Bangers', 'Segoe UI', Impact, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            perspective: 1000px;
        }

        .container {
            background-color: rgba(142, 68, 173, 0.95); /* Roxo com leve transparência */
            padding: 40px;
            width: 100%;
            max-width: 600px;
            border-radius: 5px;
            border: 5px solid var(--comic-border);
            box-shadow: 15px 15px 0px var(--comic-border);
            transform: rotateX(5deg);
            transition: transform 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .container:hover {
            transform: rotateX(0deg) scale(1.02);
        }

        h1 {
            text-align: center;
            font-size: 3.5rem;
            margin-bottom: 30px;
            color: var(--gamma-green);
            text-transform: uppercase;
            -webkit-text-stroke: 2px var(--comic-border);
            text-shadow: 5px 5px 0px var(--comic-border);
        }

        .category { margin-bottom: 15px; }

        .category-btn {
            width: 100%;
            background-color: var(--gamma-green);
            color: var(--comic-border);
            border: 3px solid var(--comic-border);
            padding: 15px 20px;
            font-size: 1.4rem;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 6px 6px 0px var(--comic-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }

        .category-btn:hover {
            transform: translate(-3px, -3px);
            box-shadow: 9px 9px 0px var(--comic-border);
            background-color: #27ae60;
        }

        .link-list {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
            background: rgba(0,0,0,0.5);
        }

        .link-list.show {
            max-height: 500px;
            padding: 15px 5px;
            border: 3px solid var(--comic-border);
            border-top: none;
            margin-top: -3px;
        }

        .link-item {
            text-decoration: none;
            color: #fff;
            background-color: rgba(255,255,255,0.1);
            padding: 12px 15px;
            margin-bottom: 8px;
            display: block;
            border: 2px solid transparent;
            transition: 0.2s;
            font-family: 'Segoe UI', sans-serif;
            font-weight: bold;
        }

        .link-item:hover {
            background-color: var(--gamma-green);
            color: var(--comic-border);
            transform: translateX(10px);
        }

        footer {
            margin-top: auto;
            background: var(--comic-border);
            color: var(--gamma-green);
            padding: 10px 30px;
            clip-path: polygon(5% 0%, 100% 0%, 95% 100%, 0% 100%);
            font-size: 1.2rem;
        }
    </style>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
</head>
<body>

    <div class="container">
        <h1>HULK CODE!</h1>

        <div class="category">
            <button class="category-btn" onclick="toggleCategory('java', this)">Exercícios Java</button>
            <div id="java" class="link-list">
                <a href="https://github.com/salivamolhada/..a" target="_blank" class="link-item">1ª Aula Back End</a>
                <a href="https://github.com" target="_blank" class="link-item">Exemplo 2 - Lógica Básica</a>
                <a  href="https://salivamolhada.github.io/variaveis.js/variaveis.js" target="_blank" class="link-item">Exemplo das variaveis</a>
                       <a  href="https://github.com/salivamolhada/usandoform" target="_blank" class="link-item">Usando form</a>
                 <a  href="https://github.com/salivamolhada/usandoreak" target="_blank" class="link-item">Usando form</a>
            </div>
        </div>

        <div class="category">
            <button class="category-btn" onclick="toggleCategory('python', this)">Exercícios Python</button>
            <div id="python" class="link-list">
                <a href="#" target="_blank" class="link-item">Exemplo 1 - Variáveis</a>
                <a href="#" target="_blank" class="link-item">Exemplo 2 - Condicionais</a>
            </div>
        </div>

        <div class="category">
            <button class="category-btn" onclick="toggleCategory('html', this)">Exercícios HTML</button>
            <div id="html" class="link-list">
                <a href="https://salivamolhada.github.io/..a/teste.html" target="_blank" class="link-item">Teste Html</a>
                <a href="https://salivamolhada.github.io" target="_blank" class="link-item">Página de Teste (Live)</a>
                 <a href="https://gamma.app/docs/Propriedade-Intelectual-Protegendo-e-Valorizando-Criacoes-e-Inova-6jxddtxaxhx9nne?mode=doc" target="_blank" class="link-item">Gamma 1 (Live)</a>
                 <a href=https://gamma.app/docs/Agenda-Escolar-Digital-O-Cerebro-da-Sua-Escola-nctq152ualg7c3g?mode=doc" target="_blank" class="link-item">Gamma 2 (Live)</a>
            </div>
        </div>

    </div>

    <footer>
        DESENVOLVIDO POR @SALIVAMOLHADA - 2026
    </footer>

    <script>
        function toggleCategory(id, btn) {
            const list = document.getElementById(id);
            if (list) {
                list.classList.toggle('show');
                btn.classList.toggle('active');
            }
        }
    </script>
</body>
</html>
