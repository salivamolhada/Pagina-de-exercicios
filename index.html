<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Exercícios - GitHub</title>
    <style>
        /* Estilo Clássico / Vintage */
        body {
            background-color: #f4f1ea; /* Papel antigo */
            font-family: 'Georgia', 'Times New Roman', serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #fffdf9;
            padding: 50px;
            border: 2px solid #5d4037;
            box-shadow: 5px 5px 20px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 450px;
        }

        h1 {
            color: #2c1e1a;
            font-variant: small-caps;
            letter-spacing: 2px;
            margin-bottom: 40px;
            border-bottom: 2px solid #5d4037;
            padding-bottom: 10px;
        }

        .link-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .link-item {
            text-decoration: none;
            color: #5d4037;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 12px;
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }

        /* Efeito de destaque ao passar o mouse */
        .link-item:hover {
            background-color: #fdfaf0;
            border: 1px solid #5d4037;
            font-style: italic;
            letter-spacing: 1px;
        }

        footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #8d7b6d;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Meus Exercícios</h1>
        
        <div class="link-list">
            <a href="https://github.com/salivamolhada/Exercicios/blob/main/bhaskara.js" target="_blank" class="link-item">Bhaskara.js</a>
            <a href="https://github.com/salivamolhada/Exercicios/blob/main/carro.js" target="_blank" class="link-item">Carro.js</a>
            <a href="https://github.com/salivamolhada/Exercicios/blob/main/notas.js" target="_blank" class="link-item">Notas.js</a>
            <a href="https://salivamolhada.github.io/..a/teste.html" target="_blank" class="link-item">Teste.html</a>
            <a href="https://github.com/salivamolhada/Exercicios/blob/main/teste.js" target="_blank" class="link-item">Teste.js</a>
            <a href="https://github.com/salivamolhada/Exercicios/blob/main/teste2.js" target="_blank" class="link-item">Teste2.js</a>
        </div>

        <footer>salivamolhada @ GitHub</footer>
    </div>

</body>
</html>
